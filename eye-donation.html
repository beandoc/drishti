<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pledge for Eye Donation | Nav-Jyoti</title>
    <meta name="description"
        content="Join the noble cause. Pledge to donate your eyes and give the gift of sight with Nav-Jyoti.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        .pledge-hero {
            padding: 140px 0 80px;
            background: linear-gradient(135deg, #070B14 0%, #0F172A 100%);
            min-height: 60vh;
            display: flex;
            align-items: center;
        }

        .pledge-container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 60px;
            border-radius: 40px;
        }

        .pledge-visual {
            position: relative;
            text-align: center;
        }

        .eye-illustration {
            width: 100%;
            max-width: 400px;
            filter: drop-shadow(0 0 30px rgba(0, 119, 182, 0.3));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .pledge-form-side h1 {
            font-size: 56px;
            margin-bottom: 24px;
            color: #fff;
        }

        .helpline-box {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .helpline-box h3 {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }

        .helpline-number {
            font-size: 36px;
            font-weight: 700;
            color: #0077B6;
            text-decoration: none;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            opacity: 0.8;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #0077B6;
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-pledge {
            width: 100%;
            background: #0077B6;
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-pledge:hover {
            background: #0088cc;
            transform: translateY(-2px);
        }

        @media (max-width: 991px) {
            .pledge-container {
                grid-template-columns: 1fr;
                padding: 40px;
            }

            .pledge-visual {
                order: -1;
            }
        }
    </style>
</head>

<body class="condition-page">
    <header class="navbar-wrapper">
        <nav class="navbar">
            <div class="nav-left">
                <a href="index.html" class="logo">
                    <svg class="logo-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <span class="logo-text">Nav-Jyoti</span>
                </a>
            </div>
            <div class="nav-right">
                <a href="index.html" class="btn-portal">Back to Home</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="pledge-hero">
            <div class="container">
                <div class="pledge-container">
                    <div class="pledge-form-side">
                        <h1>Make a pledge today</h1>
                        <p style="font-size: 20px; opacity: 0.7; margin-bottom: 40px;">To donate your eyes and give the
                            gift of sight.</p>

                        <form id="pledgeForm">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" class="form-control" placeholder="Enter your full name" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" class="form-control" placeholder="your@email.com" required>
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" class="form-control" placeholder="+91 XXXXX XXXXX" required>
                            </div>
                            <button type="submit" class="btn-pledge">Register as a Donor</button>
                        </form>

                        <div class="helpline-box">
                            <h3>24 x 7 Helpline</h3>
                            <a href="tel:04428281919" class="helpline-number">(044 2828 1919)</a>
                        </div>
                    </div>
                    <div class="pledge-visual">
                        <img src="https://images.unsplash.com/photo-1551601651-261ad04791ad?auto=format&fit=crop&w=800&q=80"
                            alt="Eye Donation" class="eye-illustration"
                            style="border-radius: 300px; border: 4px solid #0077B6;">
                        <p style="margin-top: 30px; font-style: italic; opacity: 0.5;">"Your eyes can see the world even
                            when you are not there."</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="main.js"></script>
    <script>
        document.getElementById('pledgeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Thank you for choosing to give the gift of sight. Our team will contact you shortly with the donor card.');
        });
    </script>
</body>

</html>
